run_name: audio_enhance_run
input_dir: audio
output_dir: outputs

# one of: both, real, fake
apply_to: both

overwrite: true

video_extensions:
  - .mp4

perturbations:
  video_compression:
    enabled: false
    crf: [32]
    preset: medium

  resize_down_up:
    enabled: false
    scales: [0.5]
    reencode_crf: 18
    preset: medium

  gaussian_blur:
    enabled: false
    kernel_sizes: [3]
    reencode_crf: 18
    preset: medium

  video_noise:
    enabled: false
    sigmas: [8]
    reencode_crf: 18
    preset: medium

  audio_compression:
    enabled: true
    bitrates: ["64k", "32k"]

  audio_noise:
    enabled: true
    snr_db: [20, 10]
    output_bitrate: "128k"
